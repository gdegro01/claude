<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sint-morph arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <h1>Sint-morph arena</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="overview" role="tab">Overzicht</button>
      <button class="tab" data-tab="videos" role="tab">Vergelijken</button>
      <button class="tab" data-tab="align" role="tab">Uitlijning</button>
    </nav>
    <label class="run-select" hidden>Run
      <select id="run"></select>
    </label>
  </header>

  <main>
    <section id="overview" class="view">
      <div id="ov-stats" class="stats"></div>
      <h2 class="section-title">Sessies</h2>
      <div id="ov-runs" class="run-grid"></div>
      <div class="gallery-head">
        <h2 class="section-title">Alle filmpjes</h2>
        <div class="filters">
          <div class="group" id="f-verdict">
            <button data-f="all" class="on">Alle</button>
            <button data-f="best">★ Beste</button>
            <button data-f="goed">Goed</button>
            <button data-f="twijfel">Twijfel</button>
            <button data-f="onvoldoende">Onvoldoende</button>
            <button data-f="open">Nog niet beoordeeld</button>
            <button data-f="busy">Bezig of fout</button>
          </div>
          <select id="f-model"><option value="">Alle modellen</option></select>
          <select id="f-run"><option value="">Alle sessies</option></select>
        </div>
      </div>
      <div id="ov-gallery" class="gallery"></div>
    </section>

    <section id="videos" class="view" hidden>
      <div class="toolbar">
        <div class="group" id="version" aria-label="Versie">
          <span class="label">Versie</span>
          <button data-v="fps30" class="on">30 fps</button>
          <button data-v="master">120 fps master</button>
          <button data-v="raw">Origineel</button>
        </div>
        <div class="group" id="speed" aria-label="Snelheid">
          <span class="label">Snelheid</span>
          <button data-s="0.25">0,25×</button>
          <button data-s="0.5">0,5×</button>
          <button data-s="1" class="on">1×</button>
          <button data-s="2">2×</button>
        </div>
        <label class="toggle"><input type="checkbox" id="loop" checked> Herhalen</label>
        <span class="hint">Spatie: afspelen · ← →: frame terug/vooruit</span>
      </div>
      <div id="summary" class="summary"></div>
      <div id="cards"></div>
    </section>

    <section id="align" class="view" hidden>
      <div class="toolbar">
        <label class="toggle"><input type="checkbox" id="only-issues"> Alleen wat aandacht nodig heeft</label>
        <span class="hint" id="align-info"></span>
      </div>
      <div id="align-cards" class="align-grid"></div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" title="Sluiten (Esc)">×</button>
      <div class="modal-media">
        <video id="m-video" controls loop playsinline></video>
        <div class="modal-ctl">
          <button class="nav" data-d="-1" title="Vorige (←)">‹ vorige</button>
          <div class="group" id="m-speed">
            <button data-s="0.25">0,25×</button>
            <button data-s="0.5">0,5×</button>
            <button data-s="1" class="on">1×</button>
            <button data-s="2">2×</button>
          </div>
          <button class="nav" data-d="1" title="Volgende (→)">volgende ›</button>
        </div>
      </div>
      <aside id="m-info" class="modal-info"></aside>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
