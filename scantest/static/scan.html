<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scanner · Making Waves</title>
<link rel="stylesheet" href="/static/mw.css">
<style>
  html,body{height:100%}

  /* instellen */
  #setup{max-width:440px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 20px 40px;min-height:100%;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:12px}
  #setup h1{font-size:64px;margin:44px 0 14px}
  #setup p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 30px}
  label.eyebrow{display:block;margin:20px 0 8px}
  #setup .field{width:100%;font-size:18px;padding:15px 16px}
  #setup .btn.primary{width:100%;margin-top:30px;padding:17px;font-size:13px}
  .error{color:#ff8fc4;min-height:1.4em;margin-top:14px;font-size:13px}
  #setup .strip.h{margin-top:auto}

  /* scannen */
  #scan{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
  #bar{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:var(--ink)}
  #bar .name{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #bar .count{white-space:nowrap}
  #bar .spacer{flex:1}
  #bar .btn{flex-shrink:0}
  #viewport{position:relative;flex:1;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:max(26px,env(safe-area-inset-bottom));white-space:nowrap;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:rgba(20,22,28,.6);backdrop-filter:blur(6px);
    padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
  #hint.wrap{white-space:normal;text-align:center;border-radius:14px}
  #checking{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    background:var(--lime-lt);color:var(--ink);font-weight:700;padding:8px 14px;border-radius:999px}
  .scan-region-highlight-svg{stroke:#D1FF90!important}
  .code-outline-highlight{stroke:#B8E22C!important}

  /* uitslag: blinds in, even staan, blinds omhoog weg; de camera loopt eronder door */
  #result{background:none;overflow:hidden}
  #result.geldig{--fc:var(--green)}
  #result.al_gescand{--fc:var(--orange)}
  #result.ongeldig,#result.onbekend{--fc:var(--magenta)}
  #result.fout{--fc:var(--ink-3)}
  #result .bl{position:absolute;inset:0;display:flex;z-index:-1}
  #result .bl i{flex:1;background-color:var(--fc);margin-right:-1px;transform-origin:50% 100%;
    animation:blIn .2s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 14ms)}
  #result .bl i:nth-child(even){background-image:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.08))}
  #result > :not(.bl){animation:fxIn .22s cubic-bezier(.2,.8,.2,1) .05s both}
  #result .f-timer{position:absolute;left:0;right:0;bottom:0;height:6px;background:currentColor;opacity:.3;transform-origin:0 50%;
    animation:timer var(--hold,1s) linear both}
  #result.out .bl i{transform-origin:50% 0;animation:blOut .3s cubic-bezier(.55,0,.75,.35) both;animation-delay:calc(var(--k) * 22ms)}
  #result.out > :not(.bl){animation:fxOut .16s ease-in both}
  @keyframes blIn{from{transform:scaleY(0)}}
  @keyframes blOut{to{transform:scaleY(0)}}
  @keyframes fxIn{from{opacity:0;transform:translateY(16px)}}
  @keyframes fxOut{to{opacity:0;transform:translateY(-20px)}}
  @keyframes timer{to{transform:scaleX(0)}}

  /* handmatig */
  #manual{position:fixed;inset:0;background:rgba(12,13,17,.82);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:90px 20px}
  #manual .box{width:100%;max-width:440px;background:var(--ink-2);border-radius:var(--r-panel);padding:22px}
  #manual .field{width:100%;font-size:22px;letter-spacing:.2em;text-transform:uppercase;padding:15px 16px}
  #manual .row{display:flex;gap:10px;margin-top:16px}
  #manual .row .btn{flex:1;padding:15px}
</style>
</head>
<body>

<section id="setup" class="hidden">
  <div class="brand"><span class="mark"></span><span class="eyebrow">Making Waves · Scan Test</span></div>
  <h1 class="title">Scanner</h1>
  <p>Vul de PIN in en geef deze telefoon een naam, bijvoorbeeld de ingang waar je staat.</p>
  <form id="setupForm">
    <label class="eyebrow" for="pin">PIN</label>
    <input class="field" id="pin" inputmode="numeric" autocomplete="off" required>
    <label class="eyebrow" for="scanner">Naam van deze scanner</label>
    <input class="field" id="scanner" placeholder="Ingang 1" maxlength="40" required>
    <button class="btn primary" type="submit">Start scanner</button>
    <div class="error" id="setupError"></div>
  </form>
  <div class="strip h" aria-hidden="true"><i style="background:#D1FF90"></i><i style="background:#B8E22C"></i><i style="background:#0DC13C"></i><i style="background:#1BA8B9"></i><i style="background:#7B4FF2"></i><i style="background:#FD7C2C"></i><i style="background:#EC2765"></i><i style="background:#CF1C7E"></i></div>
</section>

<section id="scan" class="hidden">
  <div id="bar">
    <span class="mark" aria-hidden="true" style="width:22px;height:18px"></span>
    <span class="name" id="scannerName"></span>
    <span class="eyebrow count" id="count"></span>
    <span class="spacer"></span>
    <button class="btn sm hidden" id="camBtn" type="button">Camera</button>
    <button class="btn sm" id="typeBtn" type="button">Typen</button>
    <button class="btn sm" id="settingsBtn" type="button">Instellen</button>
  </div>
  <div id="viewport">
    <video id="video" muted playsinline></video>
    <div id="checking" class="hidden">Controleren…</div>
    <div id="hint">Richt de camera op de QR-code</div>
  </div>
</section>

<section id="manual" class="hidden">
  <form class="box" id="manualForm">
    <label class="eyebrow" for="manualCode" style="margin-top:0">Ticketcode</label>
    <input class="field" id="manualCode" autocomplete="off" autocapitalize="characters" placeholder="ABCD-EFGH">
    <div class="row">
      <button class="btn" type="button" id="manualCancel">Annuleren</button>
      <button class="btn primary" type="submit">Controleren</button>
    </div>
  </form>
</section>

<section id="result" class="flash hidden" role="alert">
  <div class="bl" id="blinds" aria-hidden="true"></div>
  <div class="f-eyebrow" id="rIcon"></div>
  <div class="f-title" id="rTitle"></div>
  <div class="f-type" id="rType"></div>
  <div class="f-naam" id="rNaam"></div>
  <div class="f-detail" id="rDetail"></div>
  <div class="f-tap">Tik om verder te scannen</div>
  <div class="f-timer" aria-hidden="true"></div>
</section>

<script type="module">
import QrScanner from "/static/qr-scanner.min.js";

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let pin = store.get("scan_pin");
let scannerName = store.get("scan_naam");
let scanner = null;
let busy = false;
let lastCode = "";
let lastAt = 0;
let hideTimer = null;
let exitTimer = null;
let admitted = 0;
let audio = null;

// zo lang blijft de kleur staan; daarna leest de camera direct weer
const HOLD_MS = { geldig: 900, al_gescand: 1800, ongeldig: 1800, onbekend: 1800, fout: 2200 };
const EXIT_MS = 520;         // duur van het wegschuiven
const SAME_CODE_MS = 4000;   // dezelfde code binnen deze tijd negeren

function show(id) {
  for (const s of ["setup", "scan"]) $(s).classList.toggle("hidden", s !== id);
}

function updateBar() {
  $("scannerName").textContent = scannerName;
  $("count").textContent = admitted ? `${admitted} binnen` : "";
}

function formatCode(code) {
  return code && code.length === 8 ? code.slice(0, 4) + "-" + code.slice(4) : code;
}

function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const sameDay = d.toDateString() === new Date().toDateString();
  const time = d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
  return sameDay ? time : d.toLocaleDateString("nl-NL", { day: "numeric", month: "short" }) + " " + time;
}

// geluid en trillen
function beep(pattern) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    let t = audio.currentTime;
    for (const [freq, dur, gap] of pattern) {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = freq;
      osc.type = "square";
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t);
      osc.stop(t + dur);
      t += dur + gap;
    }
  } catch (e) {}
}
const SOUNDS = {
  geldig: [[1320, 0.12, 0]],
  al_gescand: [[660, 0.12, 0.08], [660, 0.12, 0]],
  ongeldig: [[220, 0.45, 0]],
  onbekend: [[220, 0.45, 0]],
  fout: [[330, 0.25, 0]],
};
const VIBRATE = { geldig: [80], al_gescand: [80, 60, 80], ongeldig: [400], onbekend: [400], fout: [200] };

$("blinds").innerHTML = Array.from({ length: 10 }, (_, k) => `<i style="--k:${k}"></i>`).join("");

function showResult(kind, data) {
  const r = $("result");
  clearTimeout(hideTimer);
  clearTimeout(exitTimer);
  r.className = "flash hidden";
  void r.offsetWidth; // animaties opnieuw starten
  r.style.setProperty("--hold", HOLD_MS[kind] + "ms");
  r.className = "flash " + kind;
  const naam = data.naam || "";
  const texts = {
    geldig: ["✓ Toegang", "Geldig", naam, ""],
    al_gescand: ["Let op", "Al gescand", naam,
      `om ${formatTime(data.gescand_op)}${data.gescand_door ? " door " + data.gescand_door : ""}`],
    ongeldig: ["✕ Geweigerd", "Ongeldig", naam, "Dit ticket is ongeldig gemaakt"],
    onbekend: ["✕ Geweigerd", "Onbekend", "", `Code ${formatCode(data.code || "")} staat niet op de lijst`],
    fout: ["Geen verbinding", "Geen antwoord", "", data.bericht || "Controleer de verbinding en scan opnieuw"],
  }[kind];
  [$("rIcon").textContent, $("rTitle").textContent, $("rNaam").textContent, $("rDetail").textContent] = texts;
  $("rType").textContent = kind === "onbekend" || kind === "fout" ? "" : (data.type || "");
  beep(SOUNDS[kind]);
  try { navigator.vibrate && navigator.vibrate(VIBRATE[kind]); } catch (e) {}
  hideTimer = setTimeout(hideResult, HOLD_MS[kind]);
}

// Bij het wegschuiven mag de volgende code al gelezen worden.
function hideResult() {
  clearTimeout(hideTimer);
  const r = $("result");
  if (r.classList.contains("hidden") || r.classList.contains("out")) return;
  lastAt = Date.now();
  busy = false;
  r.classList.add("out");
  exitTimer = setTimeout(() => (r.className = "flash hidden"), EXIT_MS);
}
$("result").addEventListener("click", hideResult);

async function api(path, options = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 6000);
  try {
    return await fetch(path, {
      ...options,
      signal: ctrl.signal,
      headers: { "Content-Type": "application/json", "X-Scan-Pin": pin, ...(options.headers || {}) },
    });
  } finally {
    clearTimeout(t);
  }
}

async function check(raw) {
  const code = (raw || "").trim();
  if (!code || busy) return;
  if (code === lastCode && Date.now() - lastAt < SAME_CODE_MS) return;
  busy = true;
  lastCode = code;
  $("checking").classList.remove("hidden");
  try {
    const res = await api("/api/scan", { method: "POST", body: JSON.stringify({ code, scanner: scannerName }) });
    if (res.status === 401) {
      busy = false;
      return openSetup("De PIN klopt niet meer. Vul hem opnieuw in.");
    }
    const data = await res.json();
    if (!res.ok) return showResult("fout", { bericht: data.fout });
    if (data.resultaat === "geldig") { admitted++; updateBar(); }
    showResult(data.resultaat, data);
  } catch (e) {
    showResult("fout", {});
  } finally {
    $("checking").classList.add("hidden");
  }
}

async function startScanner() {
  show("scan");
  updateBar();
  if (!scanner) {
    scanner = new QrScanner($("video"), (result) => check(result.data), {
      returnDetailedScanResult: true,
      preferredCamera: "environment",
      maxScansPerSecond: 12,
      highlightScanRegion: true,
      highlightCodeOutline: true,
    });
  }
  try {
    await scanner.start();
    $("hint").textContent = "Richt de camera op de QR-code";
    await pickCamera();
  } catch (e) {
    $("hint").classList.add("wrap");
    $("hint").textContent = "Geen toegang tot de camera. Sta cameratoegang toe voor deze site en herlaad de pagina.";
  }
}

// Camerakeuze. Op nieuwere iPhones stelt de gewone achtercamera op korte afstand slecht scherp;
// de gecombineerde camera (dubbel of drievoudig) wisselt dan zelf naar de macrostand.
const BACK = /back|rear|achter|environment/i;
const MULTI = /triple|dual|drievoud|dubbel/i;
let cameras = [];

async function pickCamera() {
  try { cameras = (await QrScanner.listCameras(true)).filter((c) => BACK.test(c.label)); } catch (e) { cameras = []; }
  $("camBtn").classList.toggle("hidden", cameras.length < 2);
  const saved = store.get("scan_camera");
  const pick = cameras.find((c) => c.id === saved) || cameras.find((c) => MULTI.test(c.label));
  if (pick) await useCamera(pick, false);
  else focusContinuous();
}

async function useCamera(cam, announce) {
  try {
    await scanner.setCamera(cam.id);
    store.set("scan_camera", cam.id);
    if (announce) flashHint(cam.label);
  } catch (e) {}
  focusContinuous();
}

// waar de browser het toelaat: blijven scherpstellen
function focusContinuous() {
  try {
    const track = $("video").srcObject && $("video").srcObject.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes("continuous")) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
  } catch (e) {}
}

let hintTimer = null;
function flashHint(text) {
  $("hint").textContent = text;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => ($("hint").textContent = "Richt de camera op de QR-code"), 2500);
}

$("camBtn").addEventListener("click", () => {
  if (cameras.length < 2) return;
  const current = cameras.findIndex((c) => c.id === store.get("scan_camera"));
  useCamera(cameras[(current + 1) % cameras.length], true);
});

function openSetup(message) {
  if (scanner) scanner.stop();
  $("pin").value = pin;
  $("scanner").value = scannerName;
  $("setupError").textContent = message || "";
  show("setup");
}

$("setupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  beep([[1, 0.01, 0]]); // geluid ontgrendelen tijdens een tik (iOS)
  pin = $("pin").value.trim();
  scannerName = $("scanner").value.trim() || "Scanner";
  $("setupError").textContent = "";
  try {
    const res = await api("/api/ping");
    if (res.status === 401) return ($("setupError").textContent = "Verkeerde PIN.");
    if (!res.ok) return ($("setupError").textContent = (await res.json()).fout || "Er ging iets mis.");
  } catch (err) {
    return ($("setupError").textContent = "Server niet bereikbaar.");
  }
  store.set("scan_pin", pin);
  store.set("scan_naam", scannerName);
  startScanner();
});

$("settingsBtn").addEventListener("click", () => openSetup());
$("typeBtn").addEventListener("click", () => {
  $("manual").classList.remove("hidden");
  $("manualCode").value = "";
  $("manualCode").focus();
});
$("manualCancel").addEventListener("click", () => $("manual").classList.add("hidden"));
$("manualForm").addEventListener("submit", (e) => {
  e.preventDefault();
  $("manual").classList.add("hidden");
  lastCode = "";
  check($("manualCode").value);
});

// Zonder opgeslagen PIN eerst instellen; anders vraagt iOS bij de eerste tik om geluid.
openSetup();
</script>
</body>
</html>
