<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Making Waves</title>
<link rel="stylesheet" href="/static/mw.css">
<style>
  html,body{background:#1B1D23}
  body{min-height:100vh}
  main{max-width:1600px;margin:0 auto;padding:22px 44px 24px}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:14px}
  .live{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--text)}
  .live i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(13,193,60,.6);animation:live 2s infinite}
  .live.off i{background:var(--ink-4);animation:none}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(13,193,60,.55)}70%{box-shadow:0 0 0 10px rgba(13,193,60,0)}100%{box-shadow:0 0 0 0 rgba(13,193,60,0)}}
  .spacer{flex:1}

  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
  .card{--c:var(--teal);position:relative;overflow:hidden;border-radius:var(--r-panel);padding:22px 30px 24px;min-height:0;
    background:radial-gradient(640px 360px at 100% 0%,color-mix(in srgb,var(--c) 44%,transparent),transparent 72%),var(--ink-2);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);display:flex;flex-direction:column;transition:box-shadow .6s var(--ease)}
  .card .l{font-size:17px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 78%,#fff);display:flex;align-items:center;gap:10px}
  .card .l span{color:var(--text);font-weight:400}
  .span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-12{grid-column:span 12}

  /* oplichten bij een nieuwe scan */
  .card.lit{animation:lit 1.6s var(--ease)}
  @keyframes lit{0%{box-shadow:inset 0 0 0 2px var(--c),0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent)}
    35%{box-shadow:inset 0 0 0 2px var(--c),0 0 60px 6px color-mix(in srgb,var(--c) 45%,transparent)}
    100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 0 transparent}}
  .wash{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0;
    background:radial-gradient(1200px 700px at 50% 30%,color-mix(in srgb,var(--c,#0DC13C) 22%,transparent),transparent 70%)}
  .wash.on{animation:wash 1.4s var(--ease)}
  @keyframes wash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

  /* binnen */
  .hero .v{font-family:var(--display);font-weight:800;font-size:132px;line-height:.9;letter-spacing:-.05em;color:#fff;margin-top:auto;padding-top:10px;font-variant-numeric:tabular-nums}
  .hero .v small{font-size:52px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
  .hero .row{display:flex;align-items:center;gap:16px;margin-top:10px}
  .bar{position:relative;flex:1;height:14px;border-radius:999px;background:var(--ink-deep);overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c);transition:width .8s var(--ease)}
  .pct{font-family:var(--display);font-weight:700;font-size:32px;color:#fff;min-width:96px;text-align:right;font-variant-numeric:tabular-nums}

  /* zojuist binnen */
  #last .naam{font-family:var(--display);font-weight:800;font-size:62px;line-height:.95;letter-spacing:-.04em;color:#fff;margin-top:auto;padding-top:10px;overflow-wrap:anywhere}
  #last .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted)}
  #last .lbl{font-size:15px}
  #last .empty{margin-top:auto;font-family:var(--display);font-size:30px;color:var(--muted)}
  #last .res{font-size:13px}
  #lastBody{position:relative;z-index:1;display:flex;flex-direction:column;flex:1}

  /* oplichten van de laatste scan: stroken in de kleur van het type, met naam en type groot erop */
  .fl{position:absolute;inset:0;z-index:2;pointer-events:none;display:none;color:var(--fx-ink)}
  .fl.on{display:block}
  .fl .st{position:absolute;inset:0;display:flex}
  .fl .st i{flex:1;margin-right:-1px;background:var(--fx);transform:translateY(101%);
    animation:flStrip 1.9s cubic-bezier(.65,0,.35,1) both;animation-delay:calc(var(--k) * 28ms)}
  .fl .st i:nth-child(even){background-image:linear-gradient(rgba(255,255,255,.1),rgba(255,255,255,.1))}
  .fl .tx{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:22px 30px;
    animation:flText 1.9s cubic-bezier(.2,.8,.2,1) both}
  .fl .tx b{font-family:var(--display);font-weight:800;font-size:68px;line-height:.92;letter-spacing:-.04em;overflow-wrap:anywhere}
  .fl .tx span{margin-top:12px;font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  .fl .tx span:empty{display:none}
  @keyframes flStrip{0%{transform:translateY(101%)}16%{transform:translateY(0)}72%{transform:translateY(0)}100%{transform:translateY(-101%)}}
  @keyframes flText{0%,8%{opacity:0;transform:translateY(30px) scale(.97)}24%{opacity:1;transform:none}66%{opacity:1;transform:none}80%,100%{opacity:0;transform:translateY(-24px)}}
  #last.flashing{animation:lastGlow 1.9s var(--ease)}
  @keyframes lastGlow{0%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 0 transparent}
    30%{box-shadow:inset 0 0 0 2px var(--fx),0 0 90px 14px color-mix(in srgb,var(--fx) 55%,transparent)}
    100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 0 0 0 transparent}}

  .pop{animation:pop .7s var(--ease)}
  @keyframes pop{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}

  /* per type: balk per type, spoor = totaal, vulling = binnen */
  .types{display:flex;flex-direction:column;gap:14px;margin-top:18px}
  .trow{display:grid;grid-template-columns:minmax(100px,180px) minmax(0,1fr) 110px;gap:16px;align-items:center}
  .trow .n{font-family:var(--display);font-weight:600;font-size:24px;color:#fff;display:flex;align-items:center;gap:10px;min-width:0}
  .trow .n i{width:14px;height:14px;border-radius:3px;flex:none}
  .trow .n b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .track{position:relative;height:22px;border-radius:4px;background:rgba(255,255,255,.07)}
  .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .8s var(--ease);min-width:0}
  .trow .c{font-family:var(--mono);font-size:19px;color:#fff;text-align:right;font-variant-numeric:tabular-nums}
  .trow .c span{color:var(--text)}

  /* no-show */
  .ns .v{font-family:var(--display);font-weight:800;font-size:100px;line-height:.9;letter-spacing:-.04em;color:#fff;margin-top:14px;font-variant-numeric:tabular-nums}
  .ns .v small{font-size:48px;font-weight:700;letter-spacing:0;margin-left:.08em}
  .ns .sub{font-size:16px;color:var(--text);margin-top:10px;margin-bottom:16px}
  .stack{display:flex;gap:2px;height:22px;margin-top:auto;border-radius:4px;overflow:hidden}
  .stack i{display:block;height:100%;transition:flex-grow .8s var(--ease)}
  .legend{display:flex;gap:8px 24px;flex-wrap:wrap;margin-top:12px;font-size:16px;color:var(--text)}
  .legend span{display:inline-flex;align-items:center;gap:9px}
  .legend b{font-family:var(--display);font-weight:700;font-size:20px;color:#fff;margin-left:2px;font-variant-numeric:tabular-nums}
  .legend i{width:14px;height:14px;border-radius:3px;display:block}

  /* log: elke scan op een regel */
  .log{display:flex;flex-direction:column;margin-top:8px}
  .lr{display:grid;grid-template-columns:minmax(0,1fr) 200px 90px;gap:20px;align-items:center;padding:8px 4px;border-top:1px solid rgba(255,255,255,.07)}
  .lr:first-child{border-top:0}
  .lr b{font-family:var(--display);font-weight:600;font-size:21px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:12px}
  .lr b i{width:10px;height:10px;border-radius:3px;flex:none}
  .lr b.code{font-family:var(--mono);font-weight:500;font-size:18px;color:var(--text);padding-left:22px}
  .lr time{font-family:var(--mono);font-size:17px;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
  .res{justify-self:start;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    padding:6px 12px;border-radius:8px;color:var(--r);background:color-mix(in srgb,var(--r) 18%,transparent)}
  .res.geldig{--r:#3BE06A}.res.al_gescand{--r:var(--orange)}.res.ongeldig,.res.onbekend{--r:#FF5CA8}
  .lr.new{animation:pop .7s var(--ease);background:linear-gradient(90deg,color-mix(in srgb,var(--rc,var(--green)) 16%,transparent),transparent)}
  .leeg{font-size:16px;color:var(--text);padding:12px 4px}

  .mini{display:flex;flex-direction:column;gap:10px;margin-top:16px;flex:1}
  .mini div{background:var(--ink-deep);border-radius:var(--r-card);padding:10px 20px;display:flex;align-items:center;gap:18px;flex:1}
  .mini b{display:block;font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums;min-width:96px;line-height:1}
  .mini span{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}

  #tip{position:fixed;z-index:40;pointer-events:none;background:#fff;color:var(--ink);font-size:14px;padding:8px 12px;border-radius:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap}
  #tip b{font-family:var(--display);font-size:16px}

  @media (max-width:1100px){.span-7,.span-5,.span-4,.span-8,.span-6{grid-column:span 12}.hero .v{font-size:130px}}
  @media (max-width:640px){main{padding:20px 16px 40px}.grid{gap:16px}.hero .v{font-size:96px}#last .naam{font-size:50px}}
</style>
</head>
<body>
<div class="wash" id="wash"></div>
<main>
  <header class="top">
    <div class="brand"><span class="mark"></span><span class="eyebrow">Making Waves · Scan Test</span></div>
    <span class="live" id="live"><i></i>Live</span>
    <span class="spacer"></span>
    <a class="btn" href="/admin">Admin</a>
  </header>

  <div class="grid">
    <section class="card hero span-7" id="cBinnen" style="--c:var(--green)">
      <div class="l">Binnen <span id="binnenSub"></span></div>
      <div class="v" id="binnenV">0<small> / 0</small></div>
      <div class="row"><div class="bar"><i id="binnenBar" style="width:0"></i></div><div class="pct" id="binnenPct">0%</div></div>
    </section>

    <section class="card span-5" id="last" style="--c:var(--magenta)">
      <div class="l">Laatste scan</div>
      <div id="lastBody"><div class="empty">Nog niemand gescand</div></div>
      <div class="fl" id="lastFlash"><div class="st"></div><div class="tx"><b></b><span></span></div></div>
    </section>

    <section class="card span-4" id="cTypes" style="--c:var(--purple)">
      <div class="l">Per type <span>binnen / totaal</span></div>
      <div class="types" id="types"></div>
    </section>

    <section class="card ns span-4" id="cNoshow" style="--c:var(--orange)">
      <div class="l">No-show</div>
      <div class="v" id="nsV">0<small>%</small></div>
      <div class="sub" id="nsSub"></div>
      <div class="stack" id="nsStack"></div>
      <div class="legend" id="nsLegend"></div>
    </section>

    <section class="card span-4" id="cMini" style="--c:var(--cerise)">
      <div class="l">Aan de deur</div>
      <div class="mini">
        <div><b id="mRate">0</b><span>Per minuut, laatste 5 min</span></div>
        <div><b id="mDouble">0</b><span>Dubbel gescand</span></div>
        <div><b id="mVoid">0</b><span>Ongeldig geprobeerd</span></div>
      </div>
    </section>

    <section class="card span-12" id="cLog" style="--c:var(--lime)">
      <div class="l">Scans <span>nieuwste bovenaan</span></div>
      <div class="log" id="log"></div>
    </section>
  </div>
</main>
<div id="tip" class="hidden"></div>

<script>
const $ = (id) => document.getElementById(id);
let tickets = [], types = [];
let seen = null;            // id -> gescand_op van tickets die binnen zijn
let scans = [];             // scanlog van de server, nieuwste eerst
let lastScanId = null;      // hoogste scan-id dat al getoond is
let lastJson = "";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function hhmm(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
}
function typeColor(name) { const t = types.find((x) => x.naam === name); return t ? t.kleur : "#8B8E9B"; }
function typeLabel(name) { return name ? `<span class="lbl cat" style="--c:${typeColor(name)}">${esc(name)}</span>` : ""; }
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }


async function load() {
  try {
    const res = await fetch("/api/admin/tickets", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    $("live").classList.remove("off");
    const json = JSON.stringify([data.tickets, data.types, data.scans]);
    if (json === lastJson) return;
    lastJson = json;
    tickets = data.tickets;
    types = data.types || [];
    scans = data.scans || [];
    update();
  } catch (e) {
    $("live").classList.add("off");
  }
}

function update() {
  const inside = tickets.filter((t) => t.binnen);
  const fresh = seen === null ? [] : inside.filter((t) => !seen.has(t.id));
  fresh.sort((a, b) => new Date(a.gescand_op) - new Date(b.gescand_op));
  seen = new Set(inside.map((t) => t.id));

  const prevScan = lastScanId;
  const newScans = prevScan === null ? [] : scans.filter((x) => x.id > prevScan);
  lastScanId = scans.length ? scans[0].id : prevScan === null ? 0 : prevScan;

  renderBinnen(inside);
  renderLast(scans[0], newScans.length > 0);
  renderTypes();
  renderNoshow(inside);
  renderLog(prevScan);
  renderMini(inside);
  if (fresh.length) celebrate(fresh[fresh.length - 1]);
}

function renderBinnen(inside) {
  const geldig = tickets.filter((t) => t.geldig).length;
  $("binnenV").innerHTML = `${inside.length}<small> / ${geldig}</small>`;
  $("binnenBar").style.width = pct(inside.length, geldig) + "%";
  $("binnenPct").textContent = pct(inside.length, geldig) + "%";
  $("binnenSub").textContent = "van de geldige tickets";
}

const HEX = { geldig: "#0DC13C", al_gescand: "#FD7C2C", ongeldig: "#EC2765", onbekend: "#EC2765" };
function inkOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55 ? "#2A2D35" : "#fff";
}
function codeText(c) { return c && c.length === 8 ? c.slice(0, 4) + "\u2011" + c.slice(4) : c || ""; }

function renderLast(x, isNew) {
  if (!x) { $("lastBody").innerHTML = `<div class="empty">Nog niemand gescand</div>`; return; }
  const ok = x.resultaat === "geldig";
  const color = ok ? (x.kleur || HEX.geldig) : HEX[x.resultaat] || HEX.onbekend;
  const naam = x.resultaat === "onbekend" || !x.naam ? `Code ${codeText(x.code)}` : x.naam;
  $("last").style.setProperty("--c", color);
  $("lastBody").innerHTML = `<div class="naam${isNew ? " pop" : ""}">${esc(naam)}</div>
    <div class="meta">${typeLabel(x.type)}${ok ? "" : `<span class="res ${x.resultaat}">${RESULT[x.resultaat]}</span>`}
    <span>${hhmm(x.tijd)}${x.scanner ? " · " + esc(x.scanner) : ""}</span></div>`;
  if (isNew) flashLast(naam, [x.type, ok ? "" : RESULT[x.resultaat]].filter(Boolean).join(" · "), color);
}

function flashLast(naam, sub, color) {
  const fl = $("lastFlash"), card = $("last");
  fl.style.setProperty("--fx", color);
  fl.style.setProperty("--fx-ink", inkOn(color));
  card.style.setProperty("--fx", color);
  fl.querySelector(".st").innerHTML = Array.from({ length: 12 }, (_, k) => `<i style="--k:${k}"></i>`).join("");
  fl.querySelector("b").textContent = naam;
  fl.querySelector("span").textContent = sub;
  fl.classList.remove("on"); card.classList.remove("flashing"); void fl.offsetWidth;
  fl.classList.add("on"); card.classList.add("flashing");
  clearTimeout(flashLast.t);
  flashLast.t = setTimeout(() => { fl.classList.remove("on"); card.classList.remove("flashing"); }, 2300);
}

function renderTypes() {
  const groups = types.map((x) => ({ naam: x.naam, kleur: x.kleur, items: tickets.filter((t) => t.type === x.naam && t.geldig) }));
  const untyped = tickets.filter((t) => !t.type && t.geldig);
  if (untyped.length) groups.push({ naam: "Zonder type", kleur: "#8B8E9B", items: untyped });
  const max = Math.max(1, ...groups.map((g) => g.items.length));
  $("types").innerHTML = groups.length ? groups.map((g) => {
    const b = g.items.filter((t) => t.binnen).length, n = g.items.length;
    return `<div class="trow" data-tip="${esc(g.naam)}|${b} van ${n} binnen (${pct(b, n)}%)">
      <div class="n"><i style="background:${g.kleur}"></i><b>${esc(g.naam)}</b></div>
      <div class="track" style="width:${(n / max) * 100}%"><i style="width:${pct(b, n)}%;background:${g.kleur}"></i></div>
      <div class="c">${b}<span> / ${n}</span></div></div>`;
  }).join("") : `<div class="leeg">Nog geen tickets</div>`;
}

function renderNoshow(inside) {
  const geldig = tickets.filter((t) => t.geldig);
  const verwacht = geldig.length - inside.filter((t) => t.geldig).length;
  const ongeldig = tickets.length - geldig.length;
  const ns = pct(verwacht, geldig.length);
  $("nsV").innerHTML = `${ns}<small>%</small>`;
  // hoe minder no-show, hoe groener; veel no-show kleurt rood
  $("cNoshow").style.setProperty("--c", !geldig.length ? "var(--ink-4)" : ns <= 10 ? "var(--green)" : ns <= 25 ? "var(--lime)" : ns <= 50 ? "var(--orange)" : "var(--cerise)");
  $("nsSub").textContent = `${verwacht} van ${geldig.length} geldige tickets nog niet gescand`;
  const parts = [
    { n: inside.length, c: "var(--green)", l: "Binnen" },
    { n: verwacht, c: "var(--cerise)", l: "Nog niet gescand" },
    { n: ongeldig, c: "var(--ink-4)", l: "Ongeldig" },
  ].filter((p) => p.n > 0);
  $("nsStack").innerHTML = parts.map((p) => `<i style="flex-grow:${p.n};background:${p.c}" data-tip="${p.l}|${p.n} tickets"></i>`).join("");
  $("nsLegend").innerHTML = parts.map((p) => `<span><i style="background:${p.c}"></i>${p.l}<b>${p.n}</b></span>`).join("");
}

const RESULT = { geldig: "✓ Akkoord", al_gescand: "Al gescand", ongeldig: "✕ Ongeldig", onbekend: "✕ Onbekend" };
// zoveel regels als er op het scherm passen (minstens 5)
function logRows() {
  const log = $("log"), row = log.querySelector(".lr");
  const rowH = row ? row.getBoundingClientRect().height : 50;
  const free = window.innerHeight - log.getBoundingClientRect().top - 24 - 24;
  return Math.max(5, Math.min(40, Math.floor(free / rowH)));
}

function renderLog(prev) {
  $("log").innerHTML = scans.length ? scans.slice(0, logRows()).map((x) => {
    const isNew = prev !== null && x.id > prev;
    const naam = x.resultaat === "onbekend" || !x.naam
      ? `<b class="code">${esc(x.code.length === 8 ? x.code.slice(0, 4) + "-" + x.code.slice(4) : x.code)}</b>`
      : `<b><i style="background:${x.kleur || "#8B8E9B"}"></i>${esc(x.naam)}</b>`;
    return `<div class="lr${isNew ? " new" : ""}" style="--rc:var(--${x.resultaat === "geldig" ? "green" : x.resultaat === "al_gescand" ? "orange" : "magenta"})">
      ${naam}<span class="res ${x.resultaat}">${RESULT[x.resultaat] || esc(x.resultaat)}</span><time>${hhmm(x.tijd)}</time></div>`;
  }).join("") : `<div class="leeg">De eerste scans verschijnen hier.</div>`;
}

function renderMini(inside) {
  const since = Date.now() - 5 * 60 * 1000;
  const recent = inside.filter((t) => new Date(t.gescand_op).getTime() >= since).length;
  $("mRate").textContent = (recent / 5).toFixed(1).replace(".", ",");
  $("mDouble").textContent = tickets.filter((t) => t.geldig && t.binnen).reduce((s, t) => s + Math.max(0, t.pogingen - 1), 0);
  $("mVoid").textContent = tickets.filter((t) => !t.geldig).reduce((s, t) => s + t.pogingen, 0);
}

function celebrate(t) {
  const c = t.type ? typeColor(t.type) : "#0DC13C";
  for (const id of ["cBinnen", "cTypes", "cNoshow", "cMini", "cLog"]) {
    const el = $(id);
    el.classList.remove("lit"); void el.offsetWidth; el.classList.add("lit");
  }
  const w = $("wash");
  w.style.setProperty("--c", c);
  w.classList.remove("on"); void w.offsetWidth; w.classList.add("on");
}

// tooltips
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest("[data-tip]");
  if (!el) return $("tip").classList.add("hidden");
  const [a, b] = el.dataset.tip.split("|");
  $("tip").innerHTML = `<b>${esc(a)}</b><br>${esc(b)}`;
  $("tip").style.left = Math.min(window.innerWidth - 200, e.clientX + 14) + "px";
  $("tip").style.top = e.clientY + 14 + "px";
  $("tip").classList.remove("hidden");
});

window.addEventListener("resize", () => renderLog(lastScanId));
load();
setInterval(() => { if (!document.hidden) load(); }, 1000);
setInterval(() => { if (tickets.length) renderMini(tickets.filter((t) => t.binnen)); }, 30000);
</script>
</body>
</html>
