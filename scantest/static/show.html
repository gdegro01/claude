<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2A2D35">
<title>Scherm · Making Waves</title>
<link rel="stylesheet" href="/static/mw.css">
<style>
  html,body{height:100%;overflow:hidden}
  #app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:18px;
    padding:max(18px,env(safe-area-inset-top)) max(26px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(26px,env(safe-area-inset-left))}

  header{display:flex;align-items:center;gap:16px;min-width:0}
  #menuBtn{padding:11px 18px}
  #menuBtn .bars{display:inline-block;width:16px;height:2px;background:currentColor;position:relative}
  #menuBtn .bars::before,#menuBtn .bars::after{content:"";position:absolute;left:0;width:16px;height:2px;background:currentColor}
  #menuBtn .bars::before{top:-5px}#menuBtn .bars::after{top:5px}
  #selection{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .spacer{flex:1}
  #stat{white-space:nowrap;color:var(--text)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-4);flex:none}
  .dot.on{background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent)}

  /* podium: kaart met QR links, gegevens rechts */
  #stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;justify-content:center;
    min-height:0;touch-action:pan-y;padding:0 clamp(0px,2vw,24px)}
  .ticket{background:var(--cream);border-radius:var(--r-panel);padding:clamp(6px,1vh,12px);line-height:0;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .ticket::after{content:"";position:absolute;left:22px;right:22px;bottom:-7px;height:7px;border-radius:0 0 8px 8px;
    background:var(--tc,var(--magenta))}
  #qr svg{display:block;width:min(64vh,46vw);height:auto}
  .info{display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-width:0}
  #naam{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:.95;color:#fff;
    font-size:clamp(40px,7.2vw,92px);overflow-wrap:anywhere;max-width:100%}
  #meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #type .lbl{font-size:14px}
  #code{font-size:18px;letter-spacing:.18em;color:var(--muted)}
  #status .lbl{font-size:17px}
  #status .lbl.status.on{font-weight:700}
  .empty{color:var(--muted);font-family:var(--display);font-size:28px}

  footer{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
  .nav{padding:20px;border-radius:var(--r-card);font-size:14px;letter-spacing:.16em}
  .nav:active{background:rgba(255,255,255,.06)}
  #pos{min-width:130px;border:0;background:var(--ink-2);color:var(--text);border-radius:999px;padding:14px 22px;cursor:pointer;
    font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

  .edge{position:fixed;right:0;top:0;bottom:0;width:6px;display:flex;flex-direction:column;pointer-events:none}
  .edge i{flex:1}

  /* uitschuifmenu */
  #backdrop{position:fixed;inset:0;background:rgba(12,13,17,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity var(--base)}
  #backdrop.open{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:min(380px,88vw);background:var(--ink-2);z-index:31;transform:translateX(-102%);
    transition:transform .24s var(--ease);display:flex;flex-direction:column;overflow-y:auto;
    padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));box-shadow:24px 0 60px rgba(0,0,0,.35)}
  #drawer.open{transform:none}
  .drawertop{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .drawertop b{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.03em;color:#fff}
  #drawer h2{margin:26px 0 10px}
  .opt{--c:var(--lime-lt);display:flex;width:100%;align-items:center;gap:12px;padding:14px 16px;margin-bottom:8px;border-radius:var(--r-row);
    border:0;background:var(--ink-deep);color:var(--text);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.01em}
  .opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--c);background:radial-gradient(180px 80px at 100% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%),var(--ink-deep)}
  .opt .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
  .opt .count{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
  .opt .hint{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}

  /* lijst */
  #list{position:fixed;inset:0;z-index:40;background:rgba(12,13,17,.6);display:flex;justify-content:center;align-items:flex-start;
    padding:max(28px,env(safe-area-inset-top)) 16px 28px}
  #list .box{background:var(--ink-2);border-radius:var(--r-panel);width:100%;max-width:600px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.4)}
  #list .top{display:flex;gap:10px;padding:16px;border-bottom:1px solid rgba(255,255,255,.06)}
  #list .field{flex:1}
  #rows{overflow-y:auto;padding:8px}
  .rowbtn{display:flex;width:100%;align-items:center;gap:12px;padding:13px 14px;border:0;border-radius:var(--r-row);background:none;color:var(--text);
    text-align:left;cursor:pointer;font-family:var(--display);font-size:17px;font-weight:600}
  .rowbtn:hover{background:rgba(255,255,255,.04)}
  .rowbtn.current{background:var(--ink-deep);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
  .rowbtn .c{font-family:var(--mono);color:var(--muted);font-size:12px;letter-spacing:.12em;margin-left:auto;font-weight:400}
  .rowbtn .lbl{font-size:10px}
  .sdot{width:10px;height:10px;border-radius:50%;background:var(--ink-4);flex:none}
  .sdot.in{background:var(--green)}.sdot.void{background:var(--magenta)}

  #toast{position:fixed;top:max(20px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:45;
    background:var(--lime-lt);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}

  @media (orientation:portrait),(max-width:820px){
    #stage{grid-template-columns:minmax(0,1fr);justify-items:center;align-content:center;text-align:center;gap:24px}
    .info{align-items:center}
    #qr svg{width:min(44vh,74vw)}
    #naam{font-size:clamp(34px,8vw,64px)}
  }

  /* demostand: filmpjes schermvullend, scanmeldingen als badge */
  #demo{position:fixed;inset:0;z-index:36;background:#000;overflow:hidden}
  #demo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
  #demo video.on{opacity:1}
  .demo-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;z-index:2;
    padding:max(16px,env(safe-area-inset-top)) 20px 30px;background:linear-gradient(rgba(10,11,14,.55),transparent)}
  .demo-top .eyebrow{color:#fff;opacity:.85}
  .demo-top .btn{background:rgba(20,22,28,.55);backdrop-filter:blur(6px)}
  #demoBadges{position:absolute;left:0;right:0;bottom:max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2;pointer-events:none}
  .badge{display:inline-flex;align-items:center;gap:12px;padding:14px 24px;border-radius:999px;font-family:var(--display);font-weight:700;
    font-size:24px;letter-spacing:-.01em;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:badge-in .25s var(--ease)}
  .badge small{font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
  .badge.geldig{background:var(--green);color:var(--ink)}
  .badge.al_gescand{background:var(--orange);color:var(--ink)}
  .badge.ongeldig{background:var(--magenta);color:#fff}
  .badge.uit{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
  @keyframes badge-in{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
  #demoTap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;background:rgba(10,11,14,.5);cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <header>
    <button type="button" class="btn" id="menuBtn" aria-controls="drawer"><span class="bars"></span> Menu</button>
    <span class="eyebrow" id="selection"></span>
    <span class="spacer"></span>
    <span class="eyebrow" id="stat"></span>
    <span class="dot" id="conn" title="Verbinding met de server"></span>
    <span class="mark" aria-hidden="true"></span>
  </header>

  <main id="stage">
    <div class="ticket" id="ticket"><div id="qr"></div></div>
    <div class="info">
      <div class="eyebrow" id="eyebrow">Ticket</div>
      <div id="naam"></div>
      <div id="meta"><span id="type"></span><span id="code"></span></div>
      <div id="status"></div>
    </div>
  </main>

  <footer>
    <button class="btn nav" type="button" id="prev">‹ Vorige</button>
    <button type="button" id="pos" title="Gast zoeken"></button>
    <button class="btn nav" type="button" id="next">Volgende ›</button>
  </footer>
</div>
<div class="edge" aria-hidden="true"><i style="background:#D1FF90"></i><i style="background:#B8E22C"></i><i style="background:#0DC13C"></i><i style="background:#1BA8B9"></i><i style="background:#7B4FF2"></i><i style="background:#FD7C2C"></i><i style="background:#EC2765"></i><i style="background:#CF1C7E"></i></div>

<div id="backdrop"></div>
<nav id="drawer" aria-label="Weergave">
  <div class="drawertop"><span class="mark" aria-hidden="true"></span><b>Weergave</b><span class="spacer"></span><button class="btn sm" type="button" id="drawerClose">Sluiten</button></div>
  <h2 class="eyebrow">Type</h2>
  <div id="typeOpts"></div>
  <h2 class="eyebrow">Laat zien</h2>
  <div id="statusOpts">
    <button class="opt" type="button" data-status="alle">Alle gasten<span class="count" data-count="alle"></span></button>
    <button class="opt" type="button" data-status="buiten">Nog niet binnen<span class="count" data-count="buiten"></span></button>
    <button class="opt" type="button" data-status="binnen">Al binnen<span class="count" data-count="binnen"></span></button>
  </div>
  <h2 class="eyebrow">Na een scan</h2>
  <div id="afterOpts">
    <button class="opt" type="button" data-after="blijf"><span>Blijf op dit ticket<span class="hint">Het scherm toont de nieuwe status</span></span></button>
    <button class="opt" type="button" data-after="door"><span>Ga door naar het volgende<span class="hint">Na de groene melding</span></span></button>
  </div>
  <h2 class="eyebrow">Demo</h2>
  <button class="opt" type="button" id="demoBtn"><span>Demo starten<span class="hint">Filmpjes na elkaar, demotickets eerst teruggezet</span></span></button>
  <h2 class="eyebrow">Zoeken</h2>
  <button class="opt" type="button" id="searchBtn">Gast zoeken…</button>
</nav>

<section id="list" class="hidden">
  <div class="box">
    <div class="top">
      <input class="field" id="search" type="search" placeholder="Zoek op naam, type of code" autocomplete="off">
      <button class="btn" type="button" id="listClose">Sluiten</button>
    </div>
    <div id="rows"></div>
  </div>
</section>

<section id="flash" class="flash hidden">
  <div class="f-eyebrow" id="fEyebrow"></div>
  <div class="f-title" id="fTitle"></div>
  <div class="f-type" id="fType"></div>
  <div class="f-naam" id="fNaam"></div>
  <div class="f-detail" id="fDetail"></div>
</section>
<div id="toast" class="hidden"></div>

<section id="demo" class="hidden">
  <div class="demo-top"><span class="mark" aria-hidden="true"></span><span class="eyebrow" id="demoLabel">Demo</span><span class="spacer"></span>
    <button class="btn sm" type="button" id="demoStop">Stop demo</button></div>
  <div id="demoStage"></div>
  <div id="demoBadges"></div>
  <div id="demoTap" class="hidden"><span class="btn primary">Tik om te starten</span></div>
</section>

<script src="/static/qrcode.js"></script>
<script src="/static/qrstyle.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const NO_TYPE = "__geen";
const DEFAULT_COLOR = "#CF1C7E";
const STATUS_LABEL = { alle: "Alle gasten", buiten: "Nog niet binnen", binnen: "Al binnen" };

let clientId = store.get("show_client");
if (!clientId) { clientId = "scherm-" + Math.random().toString(36).slice(2, 8); store.set("show_client", clientId); }

let tickets = [];          // alle tickets, op naam gesorteerd
let types = [];
let byId = new Map();
let orderOf = new Map();   // id -> plek in de volgorde
let dataVersie = "";
let toonVersie = -1;
let currentId = null;
let typeFilter = store.get("show_type") || "";
let statusFilter = store.get("show_status") || "alle";
let afterScan = store.get("show_after") === "door" ? "door" : "blijf";
let flashTimer = null;
let pendingNextFrom = null; // ticket waarna we doorgaan zodra de groene melding weg is
const qrCache = new Map();

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function formatCode(code) { return code.length === 8 ? code.slice(0, 4) + "-" + code.slice(4) : code; }
function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
}
function typeColor(name) { const t = types.find((x) => x.naam === name); return t ? t.kleur : null; }
function typeLabel(name) {
  return name ? `<span class="lbl cat" style="--c:${typeColor(name) || "#8B8E9B"}">${esc(name)}</span>` : "";
}
function qrSvg(code, type) {
  const color = typeColor(type) || DEFAULT_COLOR;
  const key = code + color;
  if (!qrCache.has(key)) qrCache.set(key, mwQR(code, { style: "blinds", logo: true, logoSize: 0.22, logoColor: color, bg: "#F4F1EA" }));
  return qrCache.get(key);
}

function typeOk(t) { return !typeFilter || (typeFilter === NO_TYPE ? !t.type : t.type === typeFilter); }
function statusOk(t, s = statusFilter) {
  if (s === "buiten") return t.geldig && !t.binnen;
  if (s === "binnen") return t.binnen;
  return true;
}
function matches(t) { return typeOk(t) && statusOk(t); }
function visible() { return tickets.filter(matches); }

// ---- tekenen

function render() {
  const list = visible();
  const inType = tickets.filter(typeOk);
  const t = byId.get(currentId);
  const typeName = !typeFilter ? "Alle typen" : typeFilter === NO_TYPE ? "Zonder type" : typeFilter;
  $("selection").textContent = `${typeName} · ${STATUS_LABEL[statusFilter]}`;
  $("stat").textContent = `${inType.filter((x) => x.binnen).length} van ${inType.length} binnen`;
  if (!t) {
    $("ticket").classList.add("hidden");
    $("naam").innerHTML = "";
    $("type").innerHTML = "";
    $("code").textContent = "";
    $("eyebrow").textContent = "";
    $("status").innerHTML = `<div class="empty">${tickets.length ? "Geen tickets in deze selectie." : "Nog geen tickets."}</div>`;
    $("pos").textContent = `0 / ${list.length}`;
    return;
  }
  $("ticket").classList.remove("hidden");
  $("ticket").style.setProperty("--tc", typeColor(t.type) || DEFAULT_COLOR);
  $("qr").innerHTML = qrSvg(t.code, t.type);
  $("naam").textContent = t.naam || "Zonder naam";
  $("type").innerHTML = typeLabel(t.type);
  $("code").textContent = formatCode(t.code);
  $("status").innerHTML = !t.geldig ? `<span class="lbl status" style="--c:var(--magenta)">Ongeldig</span>`
    : t.binnen ? `<span class="lbl status on" style="--c:var(--green)">✓ Binnen om ${formatTime(t.gescand_op)}${t.gescand_door ? " · " + esc(t.gescand_door) : ""}</span>`
    : `<span class="lbl status" style="--c:#6A7282">Nog niet binnen</span>`;
  const i = list.findIndex((x) => x.id === t.id);
  $("pos").textContent = i >= 0 ? `${i + 1} / ${list.length}` : `· / ${list.length}`;
  $("eyebrow").textContent = i >= 0 ? `Ticket ${i + 1} van ${list.length}` : "Buiten de selectie";
}

function renderDrawer() {
  const count = (pred) => tickets.filter(pred).length;
  const opts = [{ v: "", label: "Alle typen", items: tickets, c: "var(--lime-lt)" }]
    .concat(types.map((x) => ({ v: x.naam, label: x.naam, items: tickets.filter((t) => t.type === x.naam), c: x.kleur })));
  const untyped = tickets.filter((t) => !t.type);
  if (untyped.length && types.length) opts.push({ v: NO_TYPE, label: "Zonder type", items: untyped, c: "#8B8E9B" });
  $("typeOpts").innerHTML = opts.map((o) => `<button class="opt" type="button" data-type="${esc(o.v)}" aria-pressed="${o.v === typeFilter}" style="--c:${o.c}">
      <span class="sw"></span>${esc(o.label)}<span class="count">${o.items.filter((t) => t.binnen).length} / ${o.items.length}</span></button>`).join("");
  for (const b of $("statusOpts").children) {
    b.setAttribute("aria-pressed", String(b.dataset.status === statusFilter));
    b.querySelector(".count").textContent = count((t) => typeOk(t) && statusOk(t, b.dataset.status));
  }
  for (const b of $("afterOpts").children) b.setAttribute("aria-pressed", String(b.dataset.after === afterScan));
}

// ---- navigeren

function neighbour(fromId, dir) {
  const list = visible();
  if (!list.length) return null;
  const at = orderOf.has(fromId) ? orderOf.get(fromId) : -1;
  if (dir > 0) return (list.find((x) => orderOf.get(x.id) > at) || list[0]).id;
  const before = list.filter((x) => orderOf.get(x.id) < at);
  return (before.length ? before[before.length - 1] : list[list.length - 1]).id;
}

function go(id, { announce = true } = {}) {
  currentId = id;
  pendingNextFrom = null;
  render();
  if (announce && id != null) {
    fetch("/api/admin/toon", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticket_id: id, door: clientId }),
    }).then((r) => r.json()).then((s) => { if (s.versie > toonVersie) toonVersie = s.versie; }).catch(() => {});
  }
}

$("prev").addEventListener("click", () => currentId != null && go(neighbour(currentId, -1)));
$("next").addEventListener("click", () => currentId != null && go(neighbour(currentId, 1)));
document.addEventListener("keydown", (e) => {
  if (!$("list").classList.contains("hidden")) { if (e.key === "Escape") closeList(); return; }
  if (e.key === "Escape") closeDrawer();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
});

let touchX = null;
$("stage").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
$("stage").addEventListener("touchend", (e) => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 60) (dx < 0 ? $("next") : $("prev")).click();
});

// ---- menu

function openDrawer() { renderDrawer(); $("drawer").classList.add("open"); $("backdrop").classList.add("open"); }
function closeDrawer() { $("drawer").classList.remove("open"); $("backdrop").classList.remove("open"); }
$("menuBtn").addEventListener("click", openDrawer);
$("drawerClose").addEventListener("click", closeDrawer);
$("backdrop").addEventListener("click", closeDrawer);

function selectionChanged() {
  store.set("show_type", typeFilter);
  store.set("show_status", statusFilter);
  renderDrawer();
  const t = byId.get(currentId);
  if (!t || !matches(t)) {
    const list = visible();
    go(list.length ? (t ? neighbour(currentId, 1) : list[0].id) : currentId);
  } else render();
}
$("typeOpts").addEventListener("click", (e) => {
  const b = e.target.closest("[data-type]");
  if (!b) return;
  typeFilter = b.dataset.type;
  selectionChanged();
});
$("statusOpts").addEventListener("click", (e) => {
  const b = e.target.closest("[data-status]");
  if (!b) return;
  statusFilter = b.dataset.status;
  selectionChanged();
});
$("afterOpts").addEventListener("click", (e) => {
  const b = e.target.closest("[data-after]");
  if (!b) return;
  afterScan = b.dataset.after;
  store.set("show_after", afterScan);
  renderDrawer();
});

// ---- lijst

function openList() {
  closeDrawer();
  $("search").value = "";
  renderRows();
  $("list").classList.remove("hidden");
}
function closeList() { $("list").classList.add("hidden"); }
function renderRows() {
  const q = $("search").value.trim().toLowerCase().replace(/-/g, "");
  $("rows").innerHTML = tickets
    .filter((t) => !q || t.naam.toLowerCase().includes(q) || t.code.toLowerCase().includes(q) || t.type.toLowerCase().includes(q))
    .map((t) => `<button type="button" class="rowbtn${t.id === currentId ? " current" : ""}" data-id="${t.id}">
        <span class="sdot ${!t.geldig ? "void" : t.binnen ? "in" : ""}"></span>
        <span>${esc(t.naam || "Zonder naam")}</span>${typeLabel(t.type)}
        <span class="c">${formatCode(t.code)}</span></button>`).join("");
}
$("pos").addEventListener("click", openList);
$("searchBtn").addEventListener("click", openList);
$("listClose").addEventListener("click", closeList);
$("list").addEventListener("click", (e) => { if (e.target === $("list")) closeList(); });
$("search").addEventListener("input", renderRows);
$("rows").addEventListener("click", (e) => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  const id = Number(b.dataset.id);
  showAnyway(byId.get(id));
  closeList();
  go(id);
});

// een ticket dat buiten de selectie valt toch tonen: verruim alleen wat nodig is
function showAnyway(t) {
  if (!t) return;
  if (!typeOk(t)) typeFilter = "";
  if (!statusOk(t)) statusFilter = "alle";
  store.set("show_type", typeFilter);
  store.set("show_status", statusFilter);
}

// ---- meldingen

function flash(kind, t) {
  const f = $("flash");
  f.className = "flash " + kind;
  const texts = {
    geldig: ["Gescand", "Binnen", `om ${formatTime(t.gescand_op)}${t.gescand_door ? " door " + t.gescand_door : ""}`],
    al_gescand: ["Let op", "Al gescand", `was al binnen om ${formatTime(t.gescand_op)}`],
    ongeldig: ["Geweigerd", "Ongeldig", "Dit ticket is ongeldig gemaakt"],
  }[kind];
  [$("fEyebrow").textContent, $("fTitle").textContent, $("fDetail").textContent] = texts;
  $("fNaam").textContent = t.naam;
  $("fType").textContent = t.type || "";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(endFlash, kind === "geldig" ? 2000 : 1500);
}
function endFlash() {
  $("flash").className = "flash hidden";
  if (pendingNextFrom != null && pendingNextFrom === currentId) {
    const next = neighbour(currentId, 1);
    pendingNextFrom = null;
    if (next != null && next !== currentId) go(next);
  }
  pendingNextFrom = null;
}
$("flash").addEventListener("click", () => { clearTimeout(flashTimer); endFlash(); });

let toastTimer = null;
function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 1800);
}

// ---- gegevens ophalen

function applyTickets(list) {
  const prev = byId;
  const before = byId.get(currentId);
  tickets = list.slice().sort((a, b) => a.naam.localeCompare(b.naam, "nl", { numeric: true }) || a.id - b.id);
  byId = new Map(tickets.map((t) => [t.id, t]));
  orderOf = new Map(tickets.map((t, i) => [t.id, i]));
  if (demo) return demoFeedback(prev);
  const now = byId.get(currentId);
  if (before && now) {
    if (!before.binnen && now.binnen) {
      if (afterScan === "door") pendingNextFrom = now.id;
      flash("geldig", now);
    } else if (now.pogingen > before.pogingen) {
      if (!now.geldig) flash("ongeldig", now);
      else if (now.binnen) flash("al_gescand", now);
    }
  }
}

async function poll() {
  try {
    const res = await fetch(`/api/show/poll?client=${encodeURIComponent(clientId)}&since=${dataVersie}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    $("conn").classList.add("on");
    if (data.tickets) {
      dataVersie = String(data.versie);
      types = data.types || [];
      if (typeFilter && typeFilter !== NO_TYPE && !types.some((x) => x.naam === typeFilter)) typeFilter = "";
      applyTickets(data.tickets);
      if ($("drawer").classList.contains("open")) renderDrawer();
    }
    const toon = data.toon;
    if (toonVersie < 0) {
      // eerste keer: begin bij wat er nu getoond wordt, of bij het eerste ticket
      toonVersie = toon.versie;
      const start = byId.has(toon.ticket_id) ? toon.ticket_id : (visible()[0] || tickets[0] || {}).id;
      if (byId.has(start) && !matches(byId.get(start))) showAnyway(byId.get(start));
      go(start == null ? null : start, { announce: start !== toon.ticket_id });
    } else if (toon.versie > toonVersie) {
      toonVersie = toon.versie;
      if (toon.door !== clientId && byId.has(toon.ticket_id)) {
        showAnyway(byId.get(toon.ticket_id));
        go(toon.ticket_id, { announce: false });
        if (toon.door === "admin") toast("Gestuurd vanaf admin");
      }
    }
    if (currentId == null && tickets.length) go((visible()[0] || tickets[0]).id);
    else render();
    if (!$("list").classList.contains("hidden")) renderRows();
  } catch (e) {
    $("conn").classList.remove("on");
  }
  setTimeout(poll, 1000);
}

// ---- demostand

let demo = null;
const demoCodes = () => new Set(demo ? demo.cfg.filmpjes.map((f) => f.code) : []);

async function resetDemoTickets() {
  const codes = demoCodes();
  const todo = tickets.filter((t) => codes.has(t.code) && (t.binnen || t.pogingen));
  await Promise.all(todo.map((t) => fetch(`/api/admin/tickets/${t.id}/reset`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).catch(() => {})));
}

async function startDemo() {
  closeDrawer();
  keepAwake();
  let cfg;
  try { cfg = await fetch("/static/demo/demo.json", { cache: "no-store" }).then((r) => r.json()); }
  catch (e) { return toast("Geen demo gevonden"); }
  const missing = cfg.filmpjes.filter((f) => !tickets.some((t) => t.code === f.code));
  const stage = $("demoStage");
  stage.innerHTML = "";
  const videos = cfg.filmpjes.map((f) => {
    const v = document.createElement("video");
    v.src = "/static/demo/" + f.video;
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.setAttribute("playsinline", ""); v.setAttribute("muted", "");
    stage.appendChild(v);
    return v;
  });
  demo = { cfg, videos, i: -1, round: 0, timer: null };
  $("demoBadges").innerHTML = "";
  $("demo").classList.remove("hidden");
  if (missing.length) toast(`Niet in de lijst: ${missing.map((m) => m.naam).join(", ")}`);
  await resetDemoTickets();
  nextDemo();
}

function nextDemo() {
  if (!demo) return;
  const prev = demo.videos[demo.i];
  demo.i = (demo.i + 1) % demo.videos.length;
  if (demo.i === 0 && demo.round++ > 0) resetDemoTickets();  // elke ronde opnieuw "echt"
  const v = demo.videos[demo.i];
  $("demoLabel").textContent = `Demo · ${demo.i + 1} / ${demo.videos.length}`;
  v.currentTime = 0;
  v.onended = () => { demo && (demo.timer = setTimeout(nextDemo, demo.cfg.pauze_ms || 0)); };
  // pas wisselen als het nieuwe filmpje echt speelt, zodat er geen zwart beeld tussen zit
  v.addEventListener("playing", () => {
    v.classList.add("on");
    if (prev && prev !== v) prev.classList.remove("on");
  }, { once: true });
  v.play().then(() => $("demoTap").classList.add("hidden")).catch(() => $("demoTap").classList.remove("hidden"));
}

function stopDemo() {
  if (!demo) return;
  clearTimeout(demo.timer);
  demo.videos.forEach((v) => { v.pause(); v.removeAttribute("src"); v.load(); });
  $("demoStage").innerHTML = "";
  $("demo").classList.add("hidden");
  demo = null;
  render();
}

function demoFeedback(prev) {
  const codes = demoCodes();
  for (const t of tickets) {
    if (!codes.has(t.code)) continue;
    const b = prev.get(t.id);
    if (!b) continue;
    if (!b.binnen && t.binnen) badge("geldig", t, "binnen");
    else if (t.pogingen > b.pogingen) badge(t.geldig ? "al_gescand" : "ongeldig", t, t.geldig ? "al gescand" : "ongeldig");
  }
}

function badge(kind, t, label) {
  const el = document.createElement("div");
  el.className = "badge " + kind;
  el.innerHTML = `${kind === "geldig" ? "✓" : kind === "ongeldig" ? "✕" : "!"} ${esc(t.naam)} <small>${label}</small>`;
  $("demoBadges").appendChild(el);
  setTimeout(() => el.classList.add("uit"), 2400);
  setTimeout(() => el.remove(), 2900);
}

$("demoBtn").addEventListener("click", startDemo);
$("demoStop").addEventListener("click", stopDemo);
$("demoTap").addEventListener("click", () => { if (demo) demo.videos[demo.i].play().then(() => $("demoTap").classList.add("hidden")).catch(() => {}); });

// scherm wakker houden (Safari 16.4+)
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) {}
}
document.addEventListener("click", keepAwake);
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

poll();
</script>
