<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Tickets tonen</title>
<style>
  :root {
    --bg: #ffffff; --fg: #161616; --muted: #707070; --line: #e3e3df; --soft: #f4f4f1;
    --ok: #1f9d55; --ok-bg: #e3f4ea; --warn: #e8a317; --bad: #d64545; --bad-bg: #fbe4e4;
    --accent: #2f5bd3; --accent-bg: #e8eefc;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); }

  header { display: flex; align-items: center; gap: 14px; }
  #menuBtn { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: #fff;
    border-radius: 12px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
  #menuBtn .bars { display: inline-block; width: 18px; height: 2px; background: currentColor; position: relative; }
  #menuBtn .bars::before, #menuBtn .bars::after { content: ""; position: absolute; left: 0; width: 18px; height: 2px; background: currentColor; }
  #menuBtn .bars::before { top: -6px; } #menuBtn .bars::after { top: 6px; }
  #selection { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .spacer { flex: 1; }
  .stat { color: var(--muted); font-size: 15px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; flex-shrink: 0; }
  .dot.on { background: var(--ok); }

  #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; touch-action: pan-y; }
  #qr { background: #fff; line-height: 0; }
  #qr svg { width: min(54vh, 78vw); height: min(54vh, 78vw); }
  #naam { font-size: clamp(26px, 4.4vh, 44px); font-weight: 700; max-width: 90vw; overflow-wrap: anywhere; }
  #meta { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #code { font-family: ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: .12em; color: var(--muted); }
  .typetag { font-size: 16px; font-weight: 700; padding: 3px 12px; border-radius: 8px; background: var(--accent-bg); color: var(--accent); }
  .pill { display: inline-block; padding: 6px 16px; border-radius: 999px; font-weight: 600; font-size: 17px; }
  .pill.out { background: var(--soft); color: var(--muted); }
  .pill.in { background: var(--ok); color: #fff; }
  .pill.void { background: var(--bad); color: #fff; }
  .empty { color: var(--muted); font-size: 20px; }

  footer { display: flex; align-items: center; gap: 12px; }
  .nav { flex: 1; padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: #fff;
    font-size: 19px; font-weight: 600; cursor: pointer; }
  .nav:active { background: var(--soft); }
  #pos { min-width: 120px; padding: 18px 10px; border: 0; background: transparent; color: var(--muted);
    font-variant-numeric: tabular-nums; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 4px; }

  /* uitschuifmenu */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(360px, 88vw); background: #fff; z-index: 31;
    transform: translateX(-100%); transition: transform .22s ease; display: flex; flex-direction: column;
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); overflow-y: auto;
    box-shadow: 4px 0 24px rgba(0,0,0,.12); }
  #drawer.open { transform: none; }
  #drawer h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  #drawer h2:first-of-type { margin-top: 6px; }
  .opt { display: flex; width: 100%; align-items: center; gap: 10px; padding: 13px 14px; margin-bottom: 6px; border-radius: 12px;
    border: 1px solid var(--line); background: #fff; text-align: left; cursor: pointer; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
  .opt .count { margin-left: auto; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; font-weight: 400; }
  .opt .hint { display: block; font-size: 14px; color: var(--muted); font-weight: 400; }
  .drawertop { display: flex; align-items: center; }
  .drawertop b { font-size: 20px; }
  .close { margin-left: auto; border: 0; background: var(--soft); border-radius: 10px; padding: 9px 14px; cursor: pointer; }

  /* meldingen */
  #flash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; color: #fff; padding: 24px 16px; }
  #flash.geldig { background: var(--ok); }
  #flash.al_gescand { background: var(--warn); color: #1a1200; }
  #flash.ongeldig { background: var(--bad); }
  #flash .icon { font-size: 110px; line-height: 1; font-weight: 700; }
  #flash .title { font-size: 44px; font-weight: 800; margin-top: 14px; }
  #flash .naam { font-size: 30px; margin-top: 14px; font-weight: 600; overflow-wrap: anywhere; }
  #flash .detail { font-size: 20px; margin-top: 8px; opacity: .9; }
  #toast { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: var(--fg); color: #fff; padding: 9px 18px; border-radius: 999px; font-size: 15px; z-index: 25; }

  /* lijst */
  #list { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); display: flex; justify-content: center;
    align-items: flex-start; padding: max(24px, env(safe-area-inset-top)) 16px 24px; }
  #list .box { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; max-height: 100%;
    display: flex; flex-direction: column; overflow: hidden; }
  #list .top { display: flex; gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); }
  #list input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  #rows { overflow-y: auto; }
  .rowbtn { display: flex; width: 100%; align-items: center; gap: 12px; padding: 13px 16px; border: 0;
    border-bottom: 1px solid var(--line); background: #fff; text-align: left; cursor: pointer; }
  .rowbtn.current { background: var(--soft); font-weight: 600; }
  .rowbtn .c { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 14px; margin-left: auto; }
  .rowbtn .t { font-size: 13px; color: var(--accent); }
  .sdot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .sdot.in { background: var(--ok); }
  .sdot.void { background: var(--bad); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button type="button" id="menuBtn" aria-controls="drawer"><span class="bars"></span> Menu</button>
    <span id="selection"></span>
    <span class="spacer"></span>
    <span class="stat" id="stat"></span>
    <span class="dot" id="conn" title="Verbinding met de server"></span>
  </header>

  <main id="stage">
    <div id="qr"></div>
    <div id="naam"></div>
    <div id="meta"><span id="type"></span><span id="code"></span></div>
    <div id="status"></div>
  </main>

  <footer>
    <button class="nav" type="button" id="prev">‹ Vorige</button>
    <button type="button" id="pos" title="Gast zoeken"></button>
    <button class="nav" type="button" id="next">Volgende ›</button>
  </footer>
</div>

<div id="backdrop"></div>
<nav id="drawer" aria-label="Weergave">
  <div class="drawertop"><b>Weergave</b><button class="close" type="button" id="drawerClose">Sluiten</button></div>
  <h2>Type</h2>
  <div id="typeOpts"></div>
  <h2>Laat zien</h2>
  <div id="statusOpts">
    <button class="opt" type="button" data-status="alle">Alle gasten<span class="count" data-count="alle"></span></button>
    <button class="opt" type="button" data-status="buiten">Nog niet binnen<span class="count" data-count="buiten"></span></button>
    <button class="opt" type="button" data-status="binnen">Al binnen<span class="count" data-count="binnen"></span></button>
  </div>
  <h2>Na een scan</h2>
  <div id="afterOpts">
    <button class="opt" type="button" data-after="blijf"><span>Blijf op dit ticket<span class="hint">Het scherm toont de nieuwe status</span></span></button>
    <button class="opt" type="button" data-after="door"><span>Ga door naar het volgende<span class="hint">Na de groene melding</span></span></button>
  </div>
  <h2>Zoeken</h2>
  <button class="opt" type="button" id="searchBtn">Gast zoeken…</button>
</nav>

<section id="list" class="hidden">
  <div class="box">
    <div class="top">
      <input id="search" type="search" placeholder="Zoek op naam, type of code" autocomplete="off">
      <button class="close" type="button" id="listClose">Sluiten</button>
    </div>
    <div id="rows"></div>
  </div>
</section>

<section id="flash" class="hidden">
  <div class="icon" id="fIcon"></div>
  <div class="title" id="fTitle"></div>
  <div class="naam" id="fNaam"></div>
  <div class="detail" id="fDetail"></div>
</section>
<div id="toast" class="hidden"></div>

<script src="/static/qrcode.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const NO_TYPE = "__geen";
const STATUS_LABEL = { alle: "Alle gasten", buiten: "Nog niet binnen", binnen: "Al binnen" };

let clientId = store.get("show_client");
if (!clientId) { clientId = "scherm-" + Math.random().toString(36).slice(2, 8); store.set("show_client", clientId); }

let tickets = [];          // alle tickets, op naam gesorteerd
let types = [];
let byId = new Map();
let orderOf = new Map();   // id -> plek in de volgorde
let dataVersie = "";
let toonVersie = -1;
let currentId = null;
let typeFilter = store.get("show_type") || "";
let statusFilter = store.get("show_status") || "alle";
let afterScan = store.get("show_after") === "door" ? "door" : "blijf";
let flashTimer = null;
let pendingNextFrom = null; // ticket waarna we doorgaan zodra de groene melding weg is
const qrCache = new Map();

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function formatCode(code) { return code.length === 8 ? code.slice(0, 4) + "-" + code.slice(4) : code; }
function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
}
function qrSvg(code) {
  if (!qrCache.has(code)) {
    const qr = qrcode(0, "M");
    qr.addData(code);
    qr.make();
    qrCache.set(code, qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }));
  }
  return qrCache.get(code);
}

function typeOk(t) { return !typeFilter || (typeFilter === NO_TYPE ? !t.type : t.type === typeFilter); }
function statusOk(t, s = statusFilter) {
  if (s === "buiten") return t.geldig && !t.binnen;
  if (s === "binnen") return t.binnen;
  return true;
}
function matches(t) { return typeOk(t) && statusOk(t); }
function visible() { return tickets.filter(matches); }

// ---- tekenen

function render() {
  const list = visible();
  const inType = tickets.filter(typeOk);
  const t = byId.get(currentId);
  const typeLabel = !typeFilter ? "Alle typen" : typeFilter === NO_TYPE ? "Zonder type" : typeFilter;
  $("selection").textContent = `${typeLabel} · ${STATUS_LABEL[statusFilter]}`;
  $("stat").textContent = `${inType.filter((x) => x.binnen).length} van ${inType.length} binnen`;
  if (!t) {
    $("qr").innerHTML = "";
    $("naam").textContent = "";
    $("type").innerHTML = "";
    $("code").textContent = "";
    $("status").innerHTML = `<div class="empty">${tickets.length ? "Geen tickets in deze selectie." : "Nog geen tickets."}</div>`;
    $("pos").textContent = `0 / ${list.length}`;
    return;
  }
  $("qr").innerHTML = qrSvg(t.code);
  $("naam").textContent = t.naam || "Zonder naam";
  $("type").innerHTML = t.type ? `<span class="typetag">${esc(t.type)}</span>` : "";
  $("code").textContent = formatCode(t.code);
  $("status").innerHTML = !t.geldig ? `<span class="pill void">Ongeldig</span>`
    : t.binnen ? `<span class="pill in">✓ Binnen om ${formatTime(t.gescand_op)}${t.gescand_door ? " · " + esc(t.gescand_door) : ""}</span>`
    : `<span class="pill out">Nog niet binnen</span>`;
  const i = list.findIndex((x) => x.id === t.id);
  $("pos").textContent = i >= 0 ? `${i + 1} / ${list.length}` : `· / ${list.length}`;
}

function renderDrawer() {
  const count = (pred) => tickets.filter(pred).length;
  const opts = [{ v: "", label: "Alle typen", items: tickets }]
    .concat(types.map((x) => ({ v: x.naam, label: x.naam, items: tickets.filter((t) => t.type === x.naam) })));
  const untyped = tickets.filter((t) => !t.type);
  if (untyped.length && types.length) opts.push({ v: NO_TYPE, label: "Zonder type", items: untyped });
  $("typeOpts").innerHTML = opts.map((o) => `<button class="opt" type="button" data-type="${esc(o.v)}" aria-pressed="${o.v === typeFilter}">
      ${esc(o.label)}<span class="count">${o.items.filter((t) => t.binnen).length} / ${o.items.length}</span></button>`).join("");
  for (const b of $("statusOpts").children) {
    b.setAttribute("aria-pressed", String(b.dataset.status === statusFilter));
    b.querySelector(".count").textContent = count((t) => typeOk(t) && statusOk(t, b.dataset.status));
  }
  for (const b of $("afterOpts").children) b.setAttribute("aria-pressed", String(b.dataset.after === afterScan));
}

// ---- navigeren

function neighbour(fromId, dir) {
  const list = visible();
  if (!list.length) return null;
  const at = orderOf.has(fromId) ? orderOf.get(fromId) : -1;
  if (dir > 0) return (list.find((x) => orderOf.get(x.id) > at) || list[0]).id;
  const before = list.filter((x) => orderOf.get(x.id) < at);
  return (before.length ? before[before.length - 1] : list[list.length - 1]).id;
}

function go(id, { announce = true } = {}) {
  currentId = id;
  pendingNextFrom = null;
  render();
  if (announce && id != null) {
    fetch("/api/admin/toon", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticket_id: id, door: clientId }),
    }).then((r) => r.json()).then((s) => { if (s.versie > toonVersie) toonVersie = s.versie; }).catch(() => {});
  }
}

$("prev").addEventListener("click", () => currentId != null && go(neighbour(currentId, -1)));
$("next").addEventListener("click", () => currentId != null && go(neighbour(currentId, 1)));
document.addEventListener("keydown", (e) => {
  if (!$("list").classList.contains("hidden")) { if (e.key === "Escape") closeList(); return; }
  if (e.key === "Escape") closeDrawer();
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
});

let touchX = null;
$("stage").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
$("stage").addEventListener("touchend", (e) => {
  if (touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 60) (dx < 0 ? $("next") : $("prev")).click();
});

// ---- menu

function openDrawer() { renderDrawer(); $("drawer").classList.add("open"); $("backdrop").classList.add("open"); }
function closeDrawer() { $("drawer").classList.remove("open"); $("backdrop").classList.remove("open"); }
$("menuBtn").addEventListener("click", openDrawer);
$("drawerClose").addEventListener("click", closeDrawer);
$("backdrop").addEventListener("click", closeDrawer);

function selectionChanged() {
  store.set("show_type", typeFilter);
  store.set("show_status", statusFilter);
  renderDrawer();
  const t = byId.get(currentId);
  if (!t || !matches(t)) {
    const list = visible();
    go(list.length ? (t ? neighbour(currentId, 1) : list[0].id) : currentId);
  } else render();
}
$("typeOpts").addEventListener("click", (e) => {
  const b = e.target.closest("[data-type]");
  if (!b) return;
  typeFilter = b.dataset.type;
  selectionChanged();
});
$("statusOpts").addEventListener("click", (e) => {
  const b = e.target.closest("[data-status]");
  if (!b) return;
  statusFilter = b.dataset.status;
  selectionChanged();
});
$("afterOpts").addEventListener("click", (e) => {
  const b = e.target.closest("[data-after]");
  if (!b) return;
  afterScan = b.dataset.after;
  store.set("show_after", afterScan);
  renderDrawer();
});

// ---- lijst

function openList() {
  closeDrawer();
  $("search").value = "";
  renderRows();
  $("list").classList.remove("hidden");
}
function closeList() { $("list").classList.add("hidden"); }
function renderRows() {
  const q = $("search").value.trim().toLowerCase().replace(/-/g, "");
  $("rows").innerHTML = tickets
    .filter((t) => !q || t.naam.toLowerCase().includes(q) || t.code.toLowerCase().includes(q) || t.type.toLowerCase().includes(q))
    .map((t) => `<button type="button" class="rowbtn${t.id === currentId ? " current" : ""}" data-id="${t.id}">
        <span class="sdot ${!t.geldig ? "void" : t.binnen ? "in" : ""}"></span>
        <span>${esc(t.naam || "Zonder naam")}${t.type ? ` <span class="t">${esc(t.type)}</span>` : ""}</span>
        <span class="c">${formatCode(t.code)}</span></button>`).join("");
}
$("pos").addEventListener("click", openList);
$("searchBtn").addEventListener("click", openList);
$("listClose").addEventListener("click", closeList);
$("list").addEventListener("click", (e) => { if (e.target === $("list")) closeList(); });
$("search").addEventListener("input", renderRows);
$("rows").addEventListener("click", (e) => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  const id = Number(b.dataset.id);
  showAnyway(byId.get(id));
  closeList();
  go(id);
});

// een ticket dat buiten de selectie valt toch tonen: verruim alleen wat nodig is
function showAnyway(t) {
  if (!t) return;
  if (!typeOk(t)) typeFilter = "";
  if (!statusOk(t)) statusFilter = "alle";
  store.set("show_type", typeFilter);
  store.set("show_status", statusFilter);
}

// ---- meldingen

function flash(kind, t) {
  const f = $("flash");
  f.className = kind;
  const texts = {
    geldig: ["✓", "BINNEN", t.naam, `om ${formatTime(t.gescand_op)}${t.gescand_door ? " door " + t.gescand_door : ""}`],
    al_gescand: ["!", "AL GESCAND", t.naam, `was al binnen om ${formatTime(t.gescand_op)}`],
    ongeldig: ["✕", "ONGELDIG", t.naam, "Dit ticket is ongeldig gemaakt"],
  }[kind];
  [$("fIcon").textContent, $("fTitle").textContent, $("fNaam").textContent, $("fDetail").textContent] = texts;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(endFlash, kind === "geldig" ? 2000 : 1500);
}
function endFlash() {
  $("flash").className = "hidden";
  if (pendingNextFrom != null && pendingNextFrom === currentId) {
    const next = neighbour(currentId, 1);
    pendingNextFrom = null;
    if (next != null && next !== currentId) go(next);
  }
  pendingNextFrom = null;
}
$("flash").addEventListener("click", () => { clearTimeout(flashTimer); endFlash(); });

let toastTimer = null;
function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.add("hidden"), 1800);
}

// ---- gegevens ophalen

function applyTickets(list) {
  const before = byId.get(currentId);
  tickets = list.slice().sort((a, b) => a.naam.localeCompare(b.naam, "nl", { numeric: true }) || a.id - b.id);
  byId = new Map(tickets.map((t) => [t.id, t]));
  orderOf = new Map(tickets.map((t, i) => [t.id, i]));
  const now = byId.get(currentId);
  if (before && now) {
    if (!before.binnen && now.binnen) {
      if (afterScan === "door") pendingNextFrom = now.id;
      flash("geldig", now);
    } else if (now.pogingen > before.pogingen) {
      if (!now.geldig) flash("ongeldig", now);
      else if (now.binnen) flash("al_gescand", now);
    }
  }
}

async function poll() {
  try {
    const res = await fetch(`/api/show/poll?client=${encodeURIComponent(clientId)}&since=${dataVersie}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    $("conn").classList.add("on");
    if (data.tickets) {
      dataVersie = String(data.versie);
      types = data.types || [];
      if (typeFilter && typeFilter !== NO_TYPE && !types.some((x) => x.naam === typeFilter)) typeFilter = "";
      applyTickets(data.tickets);
      if ($("drawer").classList.contains("open")) renderDrawer();
    }
    const toon = data.toon;
    if (toonVersie < 0) {
      // eerste keer: begin bij wat er nu getoond wordt, of bij het eerste ticket
      toonVersie = toon.versie;
      const start = byId.has(toon.ticket_id) ? toon.ticket_id : (visible()[0] || tickets[0] || {}).id;
      if (byId.has(start) && !matches(byId.get(start))) showAnyway(byId.get(start));
      go(start == null ? null : start, { announce: start !== toon.ticket_id });
    } else if (toon.versie > toonVersie) {
      toonVersie = toon.versie;
      if (toon.door !== clientId && byId.has(toon.ticket_id)) {
        showAnyway(byId.get(toon.ticket_id));
        go(toon.ticket_id, { announce: false });
        if (toon.door === "admin") toast("Gestuurd vanaf admin");
      }
    }
    if (currentId == null && tickets.length) go((visible()[0] || tickets[0]).id);
    else render();
    if (!$("list").classList.contains("hidden")) renderRows();
  } catch (e) {
    $("conn").classList.remove("on");
  }
  setTimeout(poll, 1000);
}

// scherm wakker houden (Safari 16.4+)
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) {}
}
document.addEventListener("click", keepAwake);
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

poll();
</script>
